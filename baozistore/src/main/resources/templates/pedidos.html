<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baozi Store - Pedidos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        .bg-amber { background-color: #f59e0b; color: white; }
        .btn-amber { background-color: #f59e0b; color: white; }
        .btn-amber:hover { background-color: #d97706; color: white; }
        .text-amber { color: #d97706; }
    </style>
</head>
<body class="bg-light text-secondary d-flex flex-column min-vh-100">


<header class="bg-amber py-3 shadow-sm mb-5">
    <div class="container d-flex justify-content-between align-items-center">
        <a href="/" class="text-white text-decoration-none"><h1 class="h3 mb-0 fw-bold">🥟 Baozi Store</h1></a>
        <span class="badge bg-dark text-white rounded-pill px-3 py-2 shadow-sm">Pedidos</span>
    </div>
</header>


<main class="container mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-dark fw-bold mb-0">🛒 Registro de Pedidos</h2>
        <a href="/" class="btn btn-outline-secondary btn-sm">Voltar ao Início</a>
    </div>

    <div class="row g-4">

        <div class="col-12 col-lg-4">
            <div class="card shadow-sm border-0 p-3">
                <div class="card-body">
                    <h3 class="h5 text-dark fw-bold mb-3">Novo Pedido</h3>
                    <form th:action="@{/pedidos}" th:object="${pedido}" method="POST">


                        <div class="mb-3">
                            <label for="cliente" class="form-label small fw-medium text-dark">Selecione o Cliente</label>
                            <select id="cliente" th:field="*{cliente.id}" class="form-select form-select-sm" required>
                                <option value="" selected disabled>Escolha um cliente...</option>
                                <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="produto" class="form-label small fw-medium text-dark">Selecione o Produto (Baozi)</label>
                            <select id="produto" th:field="*{produto.id}" class="form-select form-select-sm" required>
                                <option value="" selected disabled>Escolha o sabor...</option>
                                <option th:each="p : ${produtos}" th:value="${p.id}" th:text="${p.nome} + ' - R$ ' + ${#numbers.formatDecimal(p.preco, 1, 2, 'COMMA')}"></option>
                            </select>
                        </div>


                        <div class="mb-3">
                            <label for="quantidade" class="form-label small fw-medium text-dark">Quantidade</label>
                            <input type="number" min="1" id="quantidade" th:field="*{quantidade}" class="form-control form-control-sm" required placeholder="Ex: 3">
                        </div>

                        <button type="submit" class="btn btn-amber btn-sm w-100 py-2 fw-medium">Registrar Venda</button>
                    </form>
                </div>
            </div>
        </div>


        <div class="col-12 col-lg-8">
            <div class="card shadow-sm border-0 p-3">
                <div class="card-body">
                    <h3 class="h5 text-dark fw-bold mb-3">Histórico de Vendas</h3>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light text-dark">
                            <tr>
                                <th scope="col" style="width: 10%;">ID</th>
                                <th scope="col">Cliente</th>
                                <th scope="col">Produto</th>
                                <th scope="col" style="width: 15%;" class="text-center">Qtd.</th>
                                <th scope="col" style="width: 20%;">Total</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="ped : ${pedidos}">
                                <td class="fw-bold text-dark" th:text="${ped.id}">1</td>
                                <td th:text="${ped.cliente.nome}">João Silva</td>
                                <td th:text="${ped.produto.nome}">Carne com Nirá</td>
                                <td class="text-center" th:text="${ped.quantidade}">2</td>

                                <td class="text-dark fw-medium" th:text="'R$ ' + ${#numbers.formatDecimal(ped.quantidade * ped.produto.preco, 1, 2, 'COMMA')}">R$ 17,00</td>
                                <td class="text-center">
                                    <form th:action="'/pedidos/excluir/' + ${ped.id}" method="POST" onsubmit="return confirm('Tem certeza que deseja cancelar este pedido?');">
                                        <button type="submit" class="btn btn-outline-danger btn-sm px-3 py-1">
                                            🗑️ Excluir
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(pedidos)}">
                                <td colspan="5" class="text-center text-muted py-4 small">Nenhum pedido efetuado ainda.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>


<footer class="bg-white border-top py-3 text-center mt-auto">
    <p class="mb-0 text-muted small">&copy; 2026 Baozi Store - Painel de Controle Interno.</p>
</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
